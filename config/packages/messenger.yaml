framework:
    messenger:
        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        failure_transport: failed

        buses:
            messenger.bus.default:
                middleware:
                    - 'App\Messenger\DeduplicateImportMiddleware'

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 0
            async_catalog:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%&queue_name=catalog&redeliver_timeout=5400'
                retry_strategy:
                    max_retries: 0
            async_offers:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%&queue_name=offers&redeliver_timeout=900'
                retry_strategy:
                    max_retries: 3
                    delay: 2000
                    multiplier: 2
                    max_delay: 10000
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            'FaustDDD\Symfony1cImport\Application\Command\ImportCatalogCommand': async_catalog
            'FaustDDD\Symfony1cImport\Application\Command\ImportOffersCommand': async_offers

security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        Symfony\Component\Security\Core\User\InMemoryUser: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        admin_users:
            memory:
                users:
                    '%env(string:ADMIN_USER)%':
                        password: '%env(string:ADMIN_PASSWORD_HASH)%'
                        roles: ['ROLE_ADMIN']

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false

        cml:
            pattern: ^/cml
            security: false

        admin:
            pattern: ^/admin
            lazy: true
            provider: admin_users
            http_basic:
                realm: 'Commerce Hub Admin'
            login_throttling:
                max_attempts: 10
                interval: '1 minute'

    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN, requires_channel: '%env(string:default::ADMIN_CHANNEL_REQUIREMENT)%' }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
            Symfony\Component\Security\Core\User\InMemoryUser:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10

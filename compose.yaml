services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: commerce_hub_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: dev
      DATABASE_URL: "postgresql://${POSTGRES_USER:-commerce_user}:${POSTGRES_PASSWORD:-secret_password}@postgres:5432/${POSTGRES_DB:-commerce_db}?serverVersion=16&charset=utf8"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: commerce_hub_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: commerce_hub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-commerce_db}
      POSTGRES_USER: ${POSTGRES_USER:-commerce_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret_password}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce_user -d commerce_db"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  worker_catalog:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: commerce_hub_worker_catalog
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "-d", "memory_limit=1024M", "bin/console", "messenger:consume", "async_catalog", "--time-limit=3600", "--memory-limit=512M", "-vv"]
    stop_grace_period: 900s
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: dev
      DATABASE_URL: "postgresql://${POSTGRES_USER:-commerce_user}:${POSTGRES_PASSWORD:-secret_password}@postgres:5432/${POSTGRES_DB:-commerce_db}?serverVersion=16&charset=utf8"
    depends_on:
      postgres:
        condition: service_healthy

  worker_offers:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: commerce_hub_worker_offers
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "-d", "memory_limit=1024M", "bin/console", "messenger:consume", "async_offers", "--time-limit=3600", "--memory-limit=512M", "-vv"]
    stop_grace_period: 300s
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: dev
      DATABASE_URL: "postgresql://${POSTGRES_USER:-commerce_user}:${POSTGRES_PASSWORD:-secret_password}@postgres:5432/${POSTGRES_DB:-commerce_db}?serverVersion=16&charset=utf8"
    depends_on:
      postgres:
        condition: service_healthy

  outbox_publisher:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: commerce_hub_outbox_publisher
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "-d", "memory_limit=256M", "bin/console", "app:cml:publish-outbox", "--daemon", "--interval=5", "--batch-size=50", "--memory-limit=128M"]
    stop_grace_period: 30s
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: dev
      DATABASE_URL: "postgresql://${POSTGRES_USER:-commerce_user}:${POSTGRES_PASSWORD:-secret_password}@postgres:5432/${POSTGRES_DB:-commerce_db}?serverVersion=16&charset=utf8"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

name: CI

on:
  push:
    branches: [ "master", "refactor/**", "feature/**" ]
  pull_request:
    branches: [ "master", "refactor/**" ]

permissions:
  contents: read

jobs:
  phpstan:
    name: PHPStan Level 8 (Admin)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_pgsql, zip
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Warmup Cache for PHPStan Container
        run: php bin/console cache:warmup --env=dev
        env:
          APP_ENV: dev
          DATABASE_URL: "postgresql://dummy:***@127.0.0.1:5432/dummy?serverVersion=16&charset=utf8"

      - name: Run PHPStan Level 8
        run: vendor/bin/phpstan analyse src/Admin src/Controller/Admin -c phpstan.dist.neon --level 8

  phpunit:
    name: PHPUnit Full Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: commerce_db_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d commerce_db_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      APP_ENV: test
      DATABASE_URL: "postgresql://test_user:***@127.0.0.1:5432/commerce_db_test?serverVersion=16&charset=utf8"
      MESSENGER_TRANSPORT_DSN: "doctrine://default?auto_setup=0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo, pdo_pgsql, pcntl, zip
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run Migrations
        run: php bin/console doctrine:migrations:migrate --env=test --no-interaction

      - name: Run PHPUnit
        run: vendor/bin/phpunit --colors=always

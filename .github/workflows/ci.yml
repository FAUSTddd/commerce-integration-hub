name: CI

on:
  push:
    branches: [ "master", "refactor/**", "feature/**" ]
  pull_request:
    branches: [ "master", "refactor/**" ]

permissions:
  contents: read

jobs:
  phpstan:
    name: PHPStan Level 8 (Admin)
    runs-on: ubuntu-latest
    env:
      APP_ENV: dev
      DEFAULT_URI: "http://localhost:8080"
      DATABASE_URL: "postgresql://dummy:***@127.0.0.1:5432/dummy?serverVersion=16&charset=utf8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_pgsql, zip
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Warmup Cache for PHPStan Container
        run: |
          touch .env
          set +e
          {
            php -v && \
            php -m && \
            php -r 'echo "PDO Drivers: " . implode(", ", PDO::getAvailableDrivers()) . PHP_EOL;' && \
            php bin/console cache:warmup --env=dev -vvv
          } > output.log 2>&1
          STATUS=$?
          if [ $STATUS -eq 0 ]; then
            cat output.log
          else
            python3 -c 'import os, re; lines = open("output.log").readlines()[-100:]; text = "".join(lines); [text := text.replace(os.environ[v], "***") for v in ("DATABASE_URL", "MESSENGER_TRANSPORT_DSN", "POSTGRES_PASSWORD") if os.environ.get(v)]; text = re.sub(r"://([^:@]+):([^@]+)@", r"://\1:***@", text); text = text[-10000:] if len(text) > 10000 else text; text = text.replace("%", "%25").replace(chr(13), "%0D").replace(chr(10), "%0A"); print(f"::error::{text}")'
            exit $STATUS
          fi

      - name: Run PHPStan Level 8
        run: |
          set +e
          vendor/bin/phpstan analyse src/Admin src/Controller/Admin -c phpstan.dist.neon --level 8 > output.log 2>&1
          STATUS=$?
          if [ $STATUS -eq 0 ]; then
            cat output.log
          else
            python3 -c 'import os, re; lines = open("output.log").readlines()[-100:]; text = "".join(lines); [text := text.replace(os.environ[v], "***") for v in ("DATABASE_URL", "MESSENGER_TRANSPORT_DSN", "POSTGRES_PASSWORD") if os.environ.get(v)]; text = re.sub(r"://([^:@]+):([^@]+)@", r"://\1:***@", text); text = text[-10000:] if len(text) > 10000 else text; text = text.replace("%", "%25").replace(chr(13), "%0D").replace(chr(10), "%0A"); print(f"::error::{text}")'
            exit $STATUS
          fi

  phpunit:
    name: PHPUnit Full Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: commerce_db_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d commerce_db_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      APP_ENV: test
      DEFAULT_URI: "http://localhost:8080"
      KERNEL_CLASS: 'App\Kernel'
      DATABASE_URL: "postgresql://test_user:test_password@127.0.0.1:5432/commerce_db?serverVersion=16&charset=utf8"
      MESSENGER_TRANSPORT_DSN: "doctrine://default?auto_setup=0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo, pdo_pgsql, pcntl, zip
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run Migrations
        run: |
          {
            touch .env && \
            php bin/console messenger:setup-transports --env=test --no-interaction && \
            php -v && \
            php -m && \
            php -r 'echo "PDO Drivers: " . implode(", ", PDO::getAvailableDrivers()) . PHP_EOL;' && \
            php bin/console doctrine:migrations:migrate --env=test --no-interaction -vvv
          } > output.log 2>&1
          STATUS=$?
          if [ $STATUS -eq 0 ]; then
            cat output.log
          else
            python3 -c 'import os, re; lines = open("output.log").readlines()[-100:]; text = "".join(lines); [text := text.replace(os.environ[v], "***") for v in ("DATABASE_URL", "MESSENGER_TRANSPORT_DSN", "POSTGRES_PASSWORD") if os.environ.get(v)]; text = re.sub(r"://([^:@]+):([^@]+)@", r"://\1:***@", text); text = text[-10000:] if len(text) > 10000 else text; text = text.replace("%", "%25").replace(chr(13), "%0D").replace(chr(10), "%0A"); print(f"::error::{text}")'
            exit $STATUS
          fi

      - name: Run PHPUnit
        run: |
          set +e
          vendor/bin/phpunit --colors=always > output.log 2>&1
          STATUS=$?
          if [ $STATUS -eq 0 ]; then
            cat output.log
          else
            python3 -c 'import os, re; lines = open("output.log").readlines()[-100:]; text = "".join(lines); [text := text.replace(os.environ[v], "***") for v in ("DATABASE_URL", "MESSENGER_TRANSPORT_DSN", "POSTGRES_PASSWORD") if os.environ.get(v)]; text = re.sub(r"://([^:@]+):([^@]+)@", r"://\1:***@", text); text = text[-10000:] if len(text) > 10000 else text; text = text.replace("%", "%25").replace(chr(13), "%0D").replace(chr(10), "%0A"); print(f"::error::{text}")'
            exit $STATUS
          fi
